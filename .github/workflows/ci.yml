# Checks every push to main and every pull request: types, lint, formatting,
# tests, both builds (the desktop server and the static export the Android
# app is made from), the desktop E2E journey, and the Windows app built, its
# Rust tests run, and driven through its own journey. It only reads the code.
# Nothing is signed or published. A run started by hand (Actions -> CI -> Run
# workflow) also makes the Store package and screenshots, and keeps them with
# the run (the "windows-store" artifact), for a release. A push that changes
# only Markdown files or docs/ doesn't run it; the next one that changes code
# checks their formatting.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch replaces a run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the desktop app runs (and where the real file-lock
        # test runs); Linux covers the folder fsync after a save.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The desktop build in a headless browser: Edge on Windows, Chrome on
      # Linux, both already on the runner. It runs while the desktop build is
      # in place: build:mobile moves .next aside. The Windows app has a job of
      # its own (below); the Android journey needs an emulator, so it is still
      # run by hand. About a minute; the limit is for a browser that hangs.
      - run: npm run e2e
        timeout-minutes: 10
      - run: npm run build:mobile

  # The Windows app (src-tauri), built as build:desktop builds it, its Rust
  # tests run, and driven through its own journey (e2e:desktop) in a WebView2
  # window: here because Smart App Control on the developer's PC blocks the
  # unsigned programs a Rust build runs. Rust is on the runner; its build is
  # kept between runs, so only the first one compiles everything. The runner's
  # WebView2 ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, so the journey also
  # asks the app itself for the DevTools port (SNIPER_JOURNAL_DEVTOOLS_PORT).
  windows-app:
    name: windows app
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The cache holds the release build and the tests' debug build ("v2":
      # the first cache had the release build only, and an exact hit is never
      # saved again, so the tests would have compiled from scratch every run).
      - uses: actions/cache/restore@v6
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/incremental/
            !src-tauri/target/debug/incremental/
          key: cargo-windows-v2-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - run: npm ci
      - run: npm run build:desktop
        id: build
      # the Rust side's own tests (src-tauri/src/folder.rs)
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          CARGO_INCREMENTAL: '0'
      # saved once the app is built, even if its tests fail, so a failure
      # below doesn't throw the compile away
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/incremental/
            !src-tauri/target/debug/incremental/
          key: cargo-windows-v2-${{ hashFiles('src-tauri/Cargo.lock') }}
      # about a minute; the limit is for a window that hangs. On a failure the
      # journey prints what the app showed and saves screenshots of it here.
      - run: npm run e2e:desktop
        timeout-minutes: 10
        env:
          SNIPER_E2E_ARTIFACTS: ${{ runner.temp }}/windows-app-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-app-e2e-failure
          path: ${{ runner.temp }}/windows-app-e2e/
          if-no-files-found: ignore
          retention-days: 7
      # The unsigned Store package (the Store signs it) and the Store
      # screenshots, from the program just built and tested: Smart App Control
      # on the developer's PC blocks the build that would make them there.
      # Only on a run started by hand: they're needed for a release, not on
      # every push.
      - run: npm run package:desktop
        if: github.event_name == 'workflow_dispatch'
      - run: npm run screenshots:store
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: windows-store
          path: |
            src-tauri/target/msix/*.msix
            assets/microsoft-store/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
