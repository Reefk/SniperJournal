# Checks every push to main and every pull request: types, lint, formatting,
# tests, both builds (the desktop server and the static export the Android
# app is made from), the desktop E2E journey, and the Windows app built. It
# only reads the code. Nothing is signed, published or uploaded.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch replaces a run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the desktop app runs (and where the real file-lock
        # test runs); Linux covers start.sh and the folder fsync after a save.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The desktop build in a headless browser: Edge on Windows, Chrome on
      # Linux, both already on the runner. It runs while the desktop build is
      # in place: build:mobile moves .next aside. The Windows app has a job of
      # its own (below); the Android journey needs an emulator, so it is still
      # run by hand. About a minute; the limit is for a browser that hangs.
      - run: npm run e2e
        timeout-minutes: 10
      - run: npm run build:mobile

  # The Windows app (src-tauri), built as build:desktop builds it: here because
  # Smart App Control on the developer's PC blocks the unsigned programs a Rust
  # build runs. Rust is on the runner; its build is kept between runs, so only
  # the first one compiles everything. Its journey (e2e:desktop) isn't run here
  # yet: on the runner the app and its WebView2 window start, but WebView2
  # doesn't open the DevTools port the journey asks for through
  # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, as it does on a PC.
  windows-app:
    name: windows app
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/cache/restore@v6
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/incremental/
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - run: npm ci
      - run: npm run build:desktop
      # saved straight after the build, so a step added after it that fails
      # (the journey, once it runs here) doesn't throw the compile away
      - uses: actions/cache/save@v6
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/incremental/
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.lock') }}
