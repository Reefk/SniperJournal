# Checks every push to main and every pull request: types, lint, formatting,
# tests, both builds (the desktop server and the static export the Android
# app is made from) and the desktop E2E journey. It only reads the code.
# Nothing is signed, published or uploaded.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch replaces a run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the desktop app runs (and where the real file-lock
        # test runs); Linux covers start.sh and the folder fsync after a save.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The desktop build in a headless browser: Edge on Windows, Chrome on
      # Linux, both already on the runner. It runs while the desktop build is
      # in place: build:mobile moves .next aside. The Windows app's journey
      # (e2e:desktop) needs a Rust toolchain and a long compile, and the
      # Android one (e2e:android) an emulator, so both are still run by hand.
      # About a minute; the limit is for a browser that hangs.
      - run: npm run e2e
        timeout-minutes: 10
      - run: npm run build:mobile
